name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v. The tag v<version> has to exist."
        required: true
      backfill:
        description: "Publish a tag whose release run failed: skip the tests, publish whatever binaries build, and leave the latest release alone"
        type: boolean
        default: false

permissions:
  contents: read

# A run started by hand builds the tag it names, not the branch it was started
# from, so that an old tag can be published with this workflow as it is now.
env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
  BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && 'true' || 'false' }}

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is the one thing there is no second chance at, so the version in the
  # header and the version on the tag are compared before anything is built.
  # Getting this wrong ships a release whose burrow_version() lies.
  verify:
    name: the tag and the header agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          header=$(sed -n 's/^#define BURROW_VERSION_STRING "\(.*\)"$/\1/p' include/burrow/version.h)
          if [ "$version" != "$header" ]; then
            echo "tag says $version, include/burrow/version.h says $header" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Everything CI would have run, run again against the tag, because a tag can
  # be pushed at a commit that never saw a pull request.
  test:
    name: test (${{ matrix.os }})
    needs: verify
    if: ${{ !inputs.backfill }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  # The source tree, exactly as tagged, with the licence files at the top. This
  # is what a distribution packager wants and it is also the fallback for anyone
  # whose platform is not one we build a binary for.
  source:
    name: source tarball
    needs: [verify, test]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: pack
        run: |
          v="${{ needs.verify.outputs.version }}"
          sha256="$PWD/tools/sha256.sh"
          mkdir -p dist
          git archive --format=tar.gz --prefix="burrow-$v/" -o "dist/burrow-$v-source.tar.gz" HEAD
          (cd dist && "$sha256" *.tar.gz > "burrow-$v-source.tar.gz.sha256")
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/

  # Static libraries for the platforms people are actually on. Not the supported
  # way to use burrow, which is the amalgamation, but the thing somebody
  # integrating into an existing cmake or make build will reach for first.
  binaries:
    name: ${{ matrix.name }}
    needs: [verify, test]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.test.result != 'failure' }}
    # A backfilled tag may not build everywhere, and what does build is still
    # worth having.
    continue-on-error: ${{ inputs.backfill == true }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-latest
          - name: darwin-x64
            os: macos-15-intel
          - name: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      # CI is what holds the tree to zero warnings. Here a compiler newer than
      # the tag, which is every compiler for an old tag, would only cost the
      # archive.
      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBURROW_BUILD_TESTS=OFF -DBURROW_WERROR=OFF
          cmake --build build --config Release
      - name: pack
        shell: bash
        run: |
          v="${{ needs.verify.outputs.version }}"
          name="burrow-$v-${{ matrix.name }}"
          sha256="$PWD/tools/sha256.sh"
          mkdir -p "stage/$name"
          cp -R include "stage/$name/"
          cp LICENSE NOTICE PATENTS README.md "stage/$name/"
          find build -name 'libburrow.a' -o -name 'burrow.lib' | head -1 | xargs -I{} cp {} "stage/$name/"
          mkdir -p dist
          tar -C stage -czf "dist/$name.tar.gz" "$name"
          (cd dist && "$sha256" "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/

  # The two file form, which is what the README tells people to download. It is
  # generated here from the tagged tree rather than kept anywhere, and the
  # manifest inside the archive lists the SHA-256 of every file it was made from,
  # so anyone can regenerate it from the source tarball and compare.
  amalgamation:
    name: amalgamation
    needs: [verify, test]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.test.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: generate
        run: tools/burrow-gen amalgamate --out "stage/burrow-${{ needs.verify.outputs.version }}-amalgamation" --source-id "v${{ needs.verify.outputs.version }}"
      - name: smoke test
        run: |
          d="stage/burrow-${{ needs.verify.outputs.version }}-amalgamation"
          cc -std=c11 -O2 -c "$d/burrow.c" -o burrow.o
          cc -std=c11 -O2 -I"$d" tests/amalgamation/hello.c burrow.o -pthread -o hello
          ./hello
      - name: pack
        run: |
          v="${{ needs.verify.outputs.version }}"
          name="burrow-$v-amalgamation"
          sha256="$PWD/tools/sha256.sh"
          cp LICENSE NOTICE PATENTS "stage/$name/"
          mkdir -p dist
          tar -C stage -czf "dist/$name.tar.gz" "$name"
          (cd stage && zip -qr "../dist/$name.zip" "$name")
          (cd dist && "$sha256" "$name.tar.gz" "$name.zip" > "$name.sha256")
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: amalgamation
          path: dist/

  publish:
    name: publish
    needs: [verify, source, binaries, amalgamation]
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.amalgamation.result == 'success' && (needs.binaries.result == 'success' || inputs.backfill) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
      # A backfilled tag is older than the latest release, so it must not
      # take that place.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.verify.outputs.version }}"
          notes=$(awk "/^## v$v /{f=1;next} /^## v/{f=0} f" CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "CHANGELOG.md has no section for v$v" >&2
            exit 1
          fi
          printf '%s\n' "$notes" > /tmp/notes.md
          latest=true
          if [ "$BACKFILL" = "true" ]; then
            latest=false
            printf '\nThis release was published after the tag, from the same tree. The release run failed when the tag was pushed, so the tests were not run again for it, and a platform whose archive is missing here did not build at this version.\n' >> /tmp/notes.md
          fi
          gh release create "v$v" dist/* \
            --title "v$v" \
            --notes-file /tmp/notes.md \
            --verify-tag \
            --latest="$latest"
