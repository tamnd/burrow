name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is the one thing there is no second chance at, so the version in the
  # header and the version on the tag are compared before anything is built.
  # Getting this wrong ships a release whose burrow_version() lies.
  verify:
    name: the tag and the header agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          header=$(sed -n 's/^#define BURROW_VERSION_STRING "\(.*\)"$/\1/p' include/burrow/version.h)
          if [ "$version" != "$header" ]; then
            echo "tag says $version, include/burrow/version.h says $header" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Everything CI would have run, run again against the tag, because a tag can
  # be pushed at a commit that never saw a pull request.
  test:
    name: test (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure

  # The source tree, exactly as tagged, with the licence files at the top. This
  # is what a distribution packager wants and it is also the fallback for anyone
  # whose platform is not one we build a binary for.
  source:
    name: source tarball
    needs: [verify, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: pack
        run: |
          v="${{ needs.verify.outputs.version }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="burrow-$v/" -o "dist/burrow-$v-source.tar.gz" HEAD
          (cd dist && sha256sum *.tar.gz > "burrow-$v-source.tar.gz.sha256")
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/

  # Static libraries for the platforms people are actually on. Not the supported
  # way to use burrow, which is the amalgamation, but the thing somebody
  # integrating into an existing cmake or make build will reach for first.
  binaries:
    name: ${{ matrix.name }}
    needs: [verify, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: darwin-arm64
            os: macos-latest
          - name: darwin-x64
            os: macos-15-intel
          - name: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBURROW_BUILD_TESTS=OFF
          cmake --build build --config Release
      - name: pack
        shell: bash
        run: |
          v="${{ needs.verify.outputs.version }}"
          name="burrow-$v-${{ matrix.name }}"
          mkdir -p "stage/$name"
          cp -R include "stage/$name/"
          cp LICENSE NOTICE PATENTS README.md "stage/$name/"
          find build -name 'libburrow.a' -o -name 'burrow.lib' | head -1 | xargs -I{} cp {} "stage/$name/"
          mkdir -p dist
          tar -C stage -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/

  publish:
    name: publish
    needs: [verify, source, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
      # Pre 1.0 everything is a prerelease, because nothing in this repository
      # has been through a security review and a green checkmark on a release
      # page reads as an endorsement it has not earned.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.verify.outputs.version }}"
          notes=$(awk "/^## v$v /{f=1;next} /^## v/{f=0} f" CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "CHANGELOG.md has no section for v$v" >&2
            exit 1
          fi
          printf '%s\n' "$notes" > /tmp/notes.md
          gh release create "v$v" dist/* \
            --title "v$v" \
            --notes-file /tmp/notes.md \
            --prerelease
