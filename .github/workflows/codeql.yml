name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because the interesting CodeQL findings tend to arrive with a new
    # query pack rather than with a new commit.
    - cron: "21 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          # security-extended adds the queries with a higher false positive rate,
          # which is the correct trade for a library whose whole job is to be
          # embedded in other people's processes.
          queries: security-extended,security-and-quality

      - name: build
        run: make lib

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
