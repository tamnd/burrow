name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The cheap checks, first, so that a pull request that breaks a rule finds
  # out in forty seconds rather than after the compiler matrix has finished.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # check-headers can only verify that a file names a real upstream file if
      # it has the Go tree to look in, and CI is the one place that always does.
      # A contributor without Go installed gets the weaker shape checks.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false

      - name: No banned libc functions
        run: tools/check-banned.sh

      - name: Every ported file names the Go file it came from
        run: tools/check-headers.sh

      - name: Every returned pointer says who owns it
        run: tools/check-annotations.sh

      - name: Nothing ignores a failed allocation
        run: tools/check-alloc.sh

      - name: Every mutable global is enumerated
        run: tools/check-globals.sh

      - name: Every file scope name is unique across files
        run: tools/check-statics.sh

      # The version is pinned because clang-format changes its mind between
      # releases. Whatever ubuntu-latest happened to ship disagreed with what
      # contributors had installed about where the space goes in
      # (uint16_t)_Alignof(T), so a correctly formatted tree failed the gate.
      # A formatter that cannot be reproduced is not a gate, it is a lottery.
      # Moving the pin is fine, it is one line here and one line in
      # CONTRIBUTING.md, and it comes with the reformat in the same commit.
      - name: clang-format
        run: |
          pipx install clang-format==20.1.7
          clang-format --version
          clang-format --dry-run --Werror $(git ls-files '*.c' '*.h')

      # The scripts in tools/ decide whether a pull request lands and whether a
      # release ships, so they get checked like anything else that can stop the
      # build. Two of the last three problems in this repository were a checker
      # that was quietly not checking.
      - name: shellcheck
        run: shellcheck tools/*.sh

      - name: Every marked code block in the docs matches its program
        run: tools/burrow-gen doc --check

      - name: Trailing whitespace and tabs
        run: |
          if git grep -nIP '[ \t]+$' -- '*.c' '*.h' '*.md' '*.yml'; then
            echo "trailing whitespace above" >&2
            exit 1
          fi

  # Four compilers, because each of them refuses something the others accept,
  # and MSVC is the one that decides the language floor. A warning that only gcc
  # emits is still a warning we want to have fixed before somebody hits it.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
          - name: linux-arm64-gcc
            os: ubuntu-24.04-arm
            cc: gcc
          - name: macos-clang
            os: macos-latest
            cc: clang
          # macos-latest is Apple silicon, so this is the only entry that
          # covers the x86_64 macOS ABI. macos-13 used to be the label for it
          # and was retired, which shows up as a job that queues forever rather
          # than as an error, so check here first if a run never finishes.
          - name: macos-x64-clang
            os: macos-15-intel
            cc: clang
          - name: windows-msvc
            os: windows-latest
            cmake: true
          - name: windows-mingw
            os: windows-latest
            cc: gcc
            shell: msys2
    steps:
      - uses: actions/checkout@v7

      - if: matrix.shell == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
          update: true

      # MSVC has no make and no business pretending to. It gets the CMake path,
      # which is the one Windows users are going to take anyway.
      - if: matrix.cmake
        name: build and test through cmake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

      - if: ${{ !matrix.cmake && matrix.shell != 'msys2' }}
        name: build and test
        run: make CC=${{ matrix.cc }} test
        env:
          CC: ${{ matrix.cc }}

      - if: matrix.shell == 'msys2'
        name: build and test
        shell: msys2 {0}
        run: make CC=${{ matrix.cc }} test

  # clang-tidy, which is a separate job because it takes a couple of minutes and
  # lint is meant to answer in under one. The configuration is .clang-tidy in the
  # root, and every check that is switched off there says why next to it.
  #
  # Pinned for the same reason clang-format is. clang-tidy gains checks with
  # every release, and a check that arrives on a Tuesday turns an unrelated pull
  # request into an afternoon of reformatting things nobody was looking at.
  # Moving the pin is a line here, a line in CONTRIBUTING.md, and whatever the
  # new checks have to say, all in one commit.
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: clang-tidy
        run: |
          pipx install clang-tidy==20.1.0
          clang-tidy --version
          make tidy

  # Big endian, which is the bug class you cannot find any other way.
  #
  # Nothing in burrow is allowed to care about byte order, and the way that rule
  # gets broken is never a cast that looks wrong. It is a test that reads the
  # first byte of an int, or a hash that walks a word, and it passes everywhere
  # anybody runs it. s390x is the only big endian target still maintained well
  # enough to build on, and under emulation the whole suite takes about three
  # minutes, which is cheap for the only check in the matrix that can find this.
  #
  # The gcc image is used rather than a distro image with a compiler installed,
  # because apt under emulation costs more than the build does. s390x is not in
  # the tag list for every gcc release, so check that before moving the tag.
  bigendian:
    name: linux-s390x-gcc (big endian)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      # The byte order is checked before the build rather than assumed. A
      # container that quietly came up on the host architecture would run the
      # suite, pass, and report a big endian job that never saw a big endian
      # machine, which is worse than not having the job at all.
      - name: build and test
        run: |
          docker run --rm --platform linux/s390x \
            -v "$PWD":/src -w /src gcc:15 \
            sh -c 'cc -dM -E - </dev/null | grep -q "__BYTE_ORDER__ __ORDER_BIG_ENDIAN__" || { echo "this is not a big endian compiler" >&2; exit 1; }; make test'

  # musl, which is the other Linux libc and the one that disagrees with glibc
  # about what a strict C11 build is allowed to see. Most of the standard
  # library is declared the same way by both, but the corners are not, and every
  # time this project has reached for something in a corner it has been musl
  # that did not have it. Alpine in a container costs about a minute and it is
  # the difference between finding that on a pull request and finding it in a
  # bug report.
  #
  # The libc is checked before the build for the same reason the big endian job
  # checks its byte order. A job that quietly ran against glibc would pass and
  # tell us nothing.
  musl:
    name: linux-musl-gcc (alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: build and test
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.20 \
            sh -c 'apk add --no-cache gcc make musl-dev >/dev/null; ldd --version 2>&1 | grep -qi musl || { echo "this is not a musl toolchain" >&2; exit 1; }; make test'

  # The portable context switch, which no machine in the matrix above would pick
  # on its own. amd64 and arm64 take the assembly and Windows takes Fibers, so
  # without this job the ucontext path is code that is compiled nowhere and
  # tested nowhere until somebody ports burrow to a third architecture and finds
  # out it never worked.
  #
  # The default build gets checked too, in the other direction. The assembly in
  # the tree is guarded on the same macros the header picks a backend with, and a
  # guard that is subtly wrong produces an object file with nothing in it, a
  # library that quietly falls back, and a suite that passes. Looking for the
  # symbol is what turns that into a failure.
  portable-context:
    name: portable context (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: the fallback
        run: make BUILD=build-portable PORTABLE_CONTEXT=1 test
      - name: the assembly is really in the default build
        run: |
          make BUILD=build-asm lib
          # GNU nm exits non zero when an archive member has no symbols in it,
          # which here is the assembly for the architecture this is not, and that is
          # the right outcome rather than a failure. The default shell has
          # pipefail on, so nm cannot be on the left of a pipe.
          #
          # burrow__mcontext_make_asm and not burrow__mcontext_switch, because
          # every backend defines a context switch and only the assembly defines
          # this one. Looking for the name both paths have would be a check that
          # passes whatever happens.
          syms=$(nm build-asm/libburrow.a 2>/dev/null || true)
          case "$syms" in
            *"T burrow__mcontext_make_asm"*) ;;
            *"T _burrow__mcontext_make_asm"*) ;;
            *)
              echo "the default build has no context switch assembly in it" >&2
              exit 1
              ;;
          esac

  # The same tree under cmake on the platforms that already built it with make,
  # because the two build descriptions drift apart silently and the only way to
  # notice is to run both.
  cmake:
    name: cmake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # The single file build, which is what most people will actually compile. It
  # is generated here twice and compared, because a generator whose output
  # depends on directory order or the time of day makes releases nobody can
  # check. Then the whole suite runs against it, and a program that knows
  # nothing about the tree is built from burrow.c and burrow.h alone, the way a
  # user would build it.
  amalgamation:
    name: amalgamation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: the same bytes every time
        run: |
          tools/burrow-gen amalgamate --out dist-a --source-id ci
          tools/burrow-gen amalgamate --out dist-b --source-id ci
          for f in burrow.c burrow.h burrow-manifest.json; do cmp "dist-a/$f" "dist-b/$f"; done
      - name: the test suite against it
        run: make AMALGAMATION=1 BUILD=build-amalg test
      - name: on its own
        run: |
          cc -std=c11 -O2 -c dist-a/burrow.c -o burrow.o
          cc -std=c11 -O2 -Wall -Wextra -Werror -Idist-a tests/amalgamation/hello.c burrow.o -pthread -o hello
          ./hello
      # Windows puts its own headers in an order of their own, and one file with
      # every source in it is where that goes wrong first, so the same file is
      # cross compiled for it too. The windows jobs above run the real thing.
      - name: for windows, with mingw
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Wall -Wextra -Werror -Wno-unused-parameter -c dist-a/burrow.c -o burrow-windows.o
          x86_64-w64-mingw32-gcc -std=c11 -O2 -Idist-a tests/amalgamation/hello.c burrow-windows.o -lws2_32 -o hello.exe

  # The gc backend is the only optional dependency in the project, and an
  # optional backend nobody builds is a backend that is already broken. One job
  # is enough: it is the same tests, and what it is really checking is that the
  # collector is still behind the interface the rest of the library agrees on.
  boehm:
    name: gc backend (boehm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgc-dev
      - run: make BOEHM=1 test
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBURROW_ENABLE_BOEHM=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # Five sanitisers, because the memory design is the part of this project most
  # likely to be wrong and the part where being wrong is worst. MemorySanitizer
  # needs every dependency instrumented to avoid false positives, which for now
  # is trivially true because burrow has no dependencies.
  sanitizers:
    name: ${{ matrix.san }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: asan+ubsan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          - san: tsan
            flags: -fsanitize=thread -fno-omit-frame-pointer
          - san: msan
            flags: -fsanitize=memory -fsanitize-memory-track-origins=2 -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v7
      # MODE=debug drops the optimisation level and with it _FORTIFY_SOURCE,
      # which needs optimisation to do anything and argues with the sanitisers
      # when it is on.
      - run: make CC=clang MODE=debug CFLAGS="-std=c11 -O1 -g -Iinclude -DBURROW_SOURCE_ID=\\\"ci\\\" ${{ matrix.flags }}" test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1

  # The programs under docs/examples, which the C blocks in the docs are
  # copies of, built against the amalgamation and run under the sanitisers. An
  # API change that breaks an example in a guide fails here, in the same pull
  # request.
  docs:
    name: docs examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: tools/burrow-gen doc --check --run --sanitize
        env:
          CC: clang

  # burrow's names have no prefix, so none of them can be one a common library
  # already defines. This installs the libraries in tools/collision-packages.txt
  # and compares their symbol tables with libburrow.a and with the C name of
  # everything in Go's API.
  collisions:
    name: symbol collisions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false
      - name: install the libraries to check against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq $(grep -v '^#' tools/collision-packages.txt | grep .)
      - run: make -j4 collisions

  # Every declaration in Go's API files mapped to its C name and looked for in
  # the headers. The packages in tools/coverage-done.txt have to be complete,
  # and the rest are reported so the number is a trend rather than a surprise.
  coverage-gate:
    name: coverage against go1.27.1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false
      - name: how much of the standard library exists
        run: tools/burrow-coverage
